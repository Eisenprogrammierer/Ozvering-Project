name: CI

# Реальный CI (пункт B1 ревью): автоматическая проверка на push/PR.
# Тесты (pytest, пункт B3) запускают скрипты-проверки с кодом возврата и
# проверяют канон, детерминизм по PYTHONHASHSEED и согласованность «доки ↔ код»
# (пункт B4). Ядру и тестам хватает стандартной библиотеки и pytest; matplotlib/
# numpy нужны лишь графикам, pygame-ce — GUI (см. requirements.txt).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка тестовых зависимостей
        run: pip install -r requirements-dev.txt

      - name: Компиляция (ядро, GUI, сценный слой, эксперименты)
        run: python -m compileall -q simulation.py warfare.py game_engine.py main.py ui experiments

      - name: Тесты (pytest)
        run: pytest -q
