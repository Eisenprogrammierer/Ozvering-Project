name: CI

# Реальный CI (пункт B1 ревью): автоматическая проверка на push/PR.
# Тесты (pytest, пункт B3) запускают скрипты-проверки с кодом возврата и
# проверяют канон, детерминизм по PYTHONHASHSEED и согласованность «доки ↔ код»
# (пункт B4). Ядру и тестам хватает стандартной библиотеки и pytest; matplotlib/
# numpy нужны лишь графикам, pygame-ce — GUI (см. requirements.txt).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка тестовых зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Компиляция (все пакеты, точка входа, эксперименты)
        run: python -m compileall -q simulation.py warfare.py game_engine.py main.py bdi.py character_traits.py information.py lod.py observability.py core41 agents campaign naming systems organizations interaction automata ui view experiments

      - name: Стиль (pycodestyle)
        run: python -m pycodestyle

      - name: Линтеры данных
        run: |
          python -m campaign.dialogue.lint
          python -m campaign.content_lint

      - name: Линтеры когнитивного слоя
        # Артефакты RiveScript и Soar генерируются из configs/ и обязаны
        # совпадать с источником; золотой корпус фиксирует кадры legacy-NLU.
        run: |
          python -m campaign.cognition.rive_compiler --check
          python -m campaign.cognition.nlu_lint --strict
          python -m campaign.cognition.corpus_builder --check
          python -m campaign.cognition.soar_compiler --check
          python -m campaign.cognition.pragmatics_compiler --check
          python -m campaign.cognition.inference_compiler --check

      - name: Тесты (pytest)
        env:
          # Headless-окружение GitHub runner: pygame инициализирует виде/аудио
          # только через dummy-драйверы, иначе GUI-тесты падают на старте.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q

  # Phase 2: Soar в тени NeedPolicy. SML-колесо собрано только под
  # manylinux x86_64, поэтому вынесено в requirements-soar.txt: основной
  # job остаётся кроссплатформенным, а здесь проверяется реальный Soar.
  soar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей и Soar SML
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r requirements-soar.txt

      - name: Soar parity
        run: pytest -q tests/test_cognition_soar.py tests/test_npc_decisions.py tests/test_d6_pragmatics.py tests/test_d6_inference.py
