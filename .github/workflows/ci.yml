name: CI

# Реальный CI (пункт B1 ревью): автоматическая проверка на push/PR.
# Тесты (pytest, пункт B3) запускают скрипты-проверки с кодом возврата и
# проверяют канон, детерминизм по PYTHONHASHSEED и согласованность «доки ↔ код»
# (пункт B4). Ядру и тестам хватает стандартной библиотеки и pytest; matplotlib/
# numpy нужны лишь графикам, pygame-ce — GUI (см. requirements.txt).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка тестовых зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Компиляция (все пакеты, точка входа, эксперименты)
        run: python -m compileall -q simulation.py warfare.py game_engine.py main.py bdi.py character_traits.py information.py lod.py observability.py core41 agents campaign naming systems organizations interaction automata ui view experiments

      - name: Стиль (pycodestyle)
        run: python -m pycodestyle

      - name: Линтеры данных
        run: |
          python -m campaign.dialogue.lint
          python -m campaign.content_lint

      - name: Тесты (pytest)
        env:
          # Headless-окружение GitHub runner: pygame инициализирует виде/аудио
          # только через dummy-драйверы, иначе GUI-тесты падают на старте.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q
