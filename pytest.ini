[pytest]
# Конфигурация тестов (пункт B3 ревью).
# Каталог тестов — tests/; pythonpath=. добавляет корень репозитория в sys.path,
# чтобы тесты импортировали simulation и модули experiments/* как при запуске
# скриптов из корня репозитория.
testpaths = tests
pythonpath = .
# -p no:libtmux: внешний плагин libtmux (ставится окружением, не нашими
# requirements) содержит фикстуру с @pytest.mark.skipif, что ломает сбор
# тестов на pytest>=9 ("Marks cannot be applied to fixtures"). Тестам
# проекта плагин не нужен — отключаем его явно (задача D1).
addopts = -ra -p no:libtmux
